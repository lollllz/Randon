<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3D8B84" />
    <meta
      name="description"
      content="Randon is a local-first daily lesson app. Topics, streaks, and cached lessons stay on this device."
    />
    <title>Randon — a random lesson, every day</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('randon:theme-pref')
          if (!pref) return
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme
          if (pref === 'dark' || pref === 'ink' || pref === 'night') theme = 'dark'
          else if (pref === 'light' || pref === 'paper' || pref === 'sepia') theme = 'light'
          else theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
