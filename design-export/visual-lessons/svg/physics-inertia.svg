<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="vl-inertia-title">
  <title id="vl-inertia-title">A carriage stops; the riders body keeps going</title>
  <rect width="360" height="220" fill="#F7F4EF"/>
  <line x1="20" y1="158" x2="340" y2="158" stroke="#E6E0D6" stroke-width="2"/>

  <g transform="translate(48 96)">
    <rect x="0" y="18" width="96" height="36" rx="8" fill="#FFFFFF" stroke="#3D8B84" stroke-width="1.7"/>
    <rect x="56" y="0" width="40" height="28" rx="8" fill="#FFFFFF" stroke="#3D8B84" stroke-width="1.7"/>
    <circle cx="22" cy="58" r="10" fill="none" stroke="#1C1917" stroke-width="1.6"/>
    <circle cx="78" cy="58" r="10" fill="none" stroke="#1C1917" stroke-width="1.6"/>
    <text x="12" y="40" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">carriage</text>
    <g class="vl-tick" data-only="0" opacity="0.7">
      <path d="M108 28 h14" stroke="#3D8B84" stroke-width="1.5"/>
      <path d="M108 38 h10" stroke="#3D8B84" stroke-width="1.5"/>
      <path d="M108 48 h14" stroke="#3D8B84" stroke-width="1.5"/>
    </g>
    <text data-only="1" x="8" y="86" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">stops</text>
  </g>

  <g transform="translate(86 70)">
    <g class="vl-body-continue" data-only="1">
      <circle cx="20" cy="14" r="10" fill="none" stroke="#C9893A" stroke-width="1.7"/>
      <path d="M20 24 v18 M8 32 h24" fill="none" stroke="#C9893A" stroke-width="1.6" stroke-linecap="round"/>
      <text x="34" y="18" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">body</text>
      <g class="vl-tick">
        <path d="M54 8 h16" stroke="#C9893A" stroke-width="1.5"/>
        <path d="M54 18 h12" stroke="#C9893A" stroke-width="1.5"/>
      </g>
    </g>
    <g data-only="0">
      <circle cx="20" cy="14" r="10" fill="none" stroke="#3D8B84" stroke-width="1.7"/>
      <path d="M20 24 v18 M8 32 h24" fill="none" stroke="#3D8B84" stroke-width="1.6" stroke-linecap="round"/>
      <text x="34" y="18" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">body</text>
    </g>
  </g>

  <path data-only="1" d="M118 92 C 160 80, 210 80, 250 90" fill="none" stroke="#C9893A" stroke-width="1.3" stroke-dasharray="5 6"/>

  <text data-only="0" x="24" y="204" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Carriage and body share the same sideways speed.</text>
  <text data-only="1" x="24" y="204" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">The carriage is stopped. The body still has the motion.</text>
</svg>
