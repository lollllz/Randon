    <path class="vl-flame" d="M180 78 C 174 68, 174 58, 180 48 C 186 58, 186 68, 180 78 Z" fill="none" stroke="#3D8B84" stroke-width="1.2"/>
    <text x="208" y="52" fill="#6F6A64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">flame</text>
  </g>
